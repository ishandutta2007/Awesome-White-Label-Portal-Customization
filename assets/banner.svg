<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <style>
      .text-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      
      /* Subtle Dynamic Animations */
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .floating-card-1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatSlow2 8.5s ease-in-out infinite;
      }
      .flowing-line {
        stroke-dasharray: 8, 6;
        animation: dashFlow 3s linear infinite;
      }
      .pulse-item {
        animation: pulseGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyanGlow)" />
  <rect width="1200" height="360" rx="16" fill="url(#purpleGlow)" />

  <!-- Background Decorative Dynamic Curves & Connections (Strictly in background) -->
  <g opacity="0.35">
    <path d="M 150 320 C 350 260, 450 340, 700 290 S 1000 320, 1150 260" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flowing-line" />
    <path d="M 50 80 C 250 140, 550 50, 850 100 S 1050 50, 1180 90" fill="none" stroke="#a855f7" stroke-width="1.5" class="flowing-line" />
  </g>

  <!-- Ambient Dynamic Floating Graphic Cards (Positioned safely on sides/bottom so text stays front & center) -->
  <g class="floating-card-1" opacity="0.85">
    <!-- Mini Client Portal Card Left -->
    <g transform="translate(60, 210)">
      <rect width="170" height="105" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <rect x="15" y="15" width="24" height="24" rx="6" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="27" cy="27" r="5" fill="#38bdf8" />
      <rect x="48" y="17" width="70" height="8" rx="4" fill="#64748b" />
      <rect x="48" y="29" width="45" height="6" rx="3" fill="#475569" />
      <line x1="15" y1="52" x2="155" y2="52" stroke="#334155" stroke-width="1" />
      <rect x="15" y="64" width="85" height="7" rx="3.5" fill="#38bdf8" fill-opacity="0.7" />
      <rect x="15" y="78" width="130" height="7" rx="3.5" fill="#475569" fill-opacity="0.5" />
      <circle cx="145" cy="27" r="4" fill="#10b981" class="pulse-item" />
    </g>
  </g>

  <g class="floating-card-2" opacity="0.85">
    <!-- Mini Brand Customization Card Right -->
    <g transform="translate(970, 200)">
      <rect width="170" height="115" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
      <text x="15" y="28" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="700">PORTAL STYLING</text>
      <circle cx="150" cy="24" r="5" fill="#818cf8" />
      <!-- Color Palette Indicators -->
      <circle cx="25" cy="50" r="10" fill="#38bdf8" />
      <circle cx="52" cy="50" r="10" fill="#818cf8" />
      <circle cx="79" cy="50" r="10" fill="#c084fc" />
      <circle cx="106" cy="50" r="10" fill="#10b981" />
      <rect x="15" y="72" width="140" height="6" rx="3" fill="#475569" />
      <rect x="15" y="85" width="95" height="6" rx="3" fill="#64748b" />
      <rect x="15" y="98" width="60" height="6" rx="3" fill="#818cf8" />
    </g>
  </g>

  <!-- Top Pill / Tag -->
  <g transform="translate(460, 42)">
    <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="18" cy="15" r="4" fill="#38bdf8" class="pulse-item" />
    <text x="32" y="20" fill="#38bdf8" class="badge-text">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <!-- Title with Gradient -->
  <text x="600" y="132" text-anchor="middle" class="text-title" fill="url(#primaryGrad)">
    Awesome White-Label Portal Customization
  </text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="172" text-anchor="middle" class="text-subtitle">
    Enterprise SaaS &amp; Open-Source Client Portals • Secure File Sharing • Custom Branding
  </text>
  <!-- Subtitle Line 2 -->
  <text x="600" y="198" text-anchor="middle" class="text-subtitle" font-size="15" fill="#64748b">
    Tailored Solutions for Digital Agencies, Consultancies, MSPs, &amp; Enterprise Service Teams
  </text>

  <!-- Badges / Tags Row -->
  <g transform="translate(370, 245)">
    <!-- SaaS Solutions -->
    <g transform="translate(0, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="67" y="22" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="600">⚡ SaaS Suites</text>
    </g>
    <!-- Open-Source -->
    <g transform="translate(148, 0)">
      <rect width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="77" y="22" text-anchor="middle" fill="#a855f7" font-family="system-ui" font-size="13" font-weight="600">🔓 Open-Source</text>
    </g>
    <!-- Self-Hosted -->
    <g transform="translate(316, 0)">
      <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="22" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="13" font-weight="600">🛡️ Self-Hosted</text>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />
</svg>
